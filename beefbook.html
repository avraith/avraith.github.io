<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BeefBook</title>
</head>
<body style="background-color: Violet;">
  <h1 style="font-family: Verdana;">BeefBook</h1>

  <form id="submitForm" action="PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE" method="POST">
    <label>Username:</label><br>
    <input type="text" name="username" id="uname" required><br><br>

    <label>Code:</label><br>
    <textarea name="password" id="code" required></textarea><br><br>

    <input type="submit" value="Submit">
  </form>

  <script>
    // Save locally on submit, then let the form POST normally
    document.getElementById('submitForm').onsubmit = function() {
      const uname = document.getElementById('uname').value.trim();
      const code = document.getElementById('code').value.trim();

      // Save to localStorage for logged-in page
      localStorage.setItem('username', uname);
      localStorage.setItem('code', code);

      // Redirect after a short delay to ensure form submission completes
      setTimeout(() => {
        window.location.href = './BBlogedin.html';
      }, 300);

      // Allow form to submit normally to Google Apps Script
      return true;
    };
  </script>
</body>
</html>
