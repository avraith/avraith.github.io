
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BeefBook</title>
  </head>
  <body style="background-color: Violet;">
    <h1 style="font-family: Verdana;">BeefBook</h1>

    <form id="submitForm">
      <label for="uname">Username:</label><br>
      <input type="text" id="uname" name="username" required><br><br>
      <input type="submit" value="Log in">
    </form>

    <script>
      const URL = 'https://script.google.com/macros/s/AKfycbyDBqVGK07jiKcZPbpwoQbxgmM94nqB5NCrD7pamoQwbgsaotfGxUUzIz_3jGDQZ-pE/exec'; // Paste your Apps Script URL here
      document.getElementById('submitForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
          username: document.getElementById('uname').value.trim()
        };

        const res = await fetch(URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const text = await res.text();
        if (res.ok && text.startsWith('OK')) {
          // ✅ Redirect to next page
          window.location.href = 'BBlogedin.html'; // or use window.open(..., '_blank') for new tab
        } else {
          alert('Submission failed: ' + text);
        }
      });
    </script>
  </body>
</html>
