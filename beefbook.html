
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BeefBook</title>
  </head>
  <body style="background-color: Violet;">
    <h1 style="font-family: Verdana;">BeefBook</h1>

    <form id="submitForm">
      <label for="uname">Username:</label><br>
      <input type="text" id="uname" name="username" required><br><br>

      <label for="password">Code:</label><br>
      <textarea id="password" name="password" placeholder="Code"></textarea><br><br>

      <input type="submit" value="Log in">
    </form>

    <script>
      const URL = 'https://script.google.com/macros/s/AKfycbyZCJT3dHY-oV4U1NzA-_6hjS6ynKQ3Cq3u1waY-gUZKCecymlKYf8HVmzow7UjRKhy/exec';

      document.getElementById('submitForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
          username: document.getElementById('uname').value.trim(),
          // email removed
          password: document.getElementById('password').value.trim()
        };

        try {
          const res = await fetch(URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const text = await res.text();

          if (res.ok && text.startsWith('OK')) {
            // Open next page in a new tab
            // Use relative path so it works on GitHub Pages repos
            window.open('BBlogedin.html', '_blank');
          } else {
            alert('Submission failed: ' + text);
          }
        } catch (err) {
          alert('Network error: ' + err);
        }
      });
    </script>
  </body>
</html>
