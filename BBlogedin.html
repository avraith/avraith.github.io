<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BeefBook – Logged in</title>
  </head>
  <body style="background-color: Violet;">
    <h1 style="font-family: Verdana;">BeefBook</h1>
    <p id="greeting"></p>

    <script>
      // Read username and code from query parameters
      const params = new URLSearchParams(window.location.search);
      const username = params.get('uname');
      const code = params.get('code'); // optional, only if you need it

      const greetingEl = document.getElementById('greeting');
      greetingEl.textContent = `Hej, ${username}! Velkommen 👋`;
    </script>
  </body>
</html>
