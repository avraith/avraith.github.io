<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BeefBook – Logged in</title>
  </head>
  <body style="background-color: Violet;">
    <h1 style="font-family: Verdana;">BeefBook</h1>
    <p id="greeting"></p>

    <script>
      // Read username from sessionStorage
      const username = sessionStorage.getItem('username') || 'Gæst';
      const greetingEl = document.getElementById('greeting');
      greetingEl.textContent = `Hej, ${username}! Velkommen 👋`;
    </script>
  </body>
</html>
